<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMax slice">
  <!-- Original stylized skyline, not a photograph of any real building: gothic spires, a central
       clock tower evoking Yale's own Harkness Tower, and an autumn tree line, in flat Yale-blue
       silhouette tones for the storefront hero background. -->
  <g fill="#002347" fill-opacity="0.55">
    <polygon points="0,420 0,300 40,300 40,260 70,230 100,260 100,300 140,300 140,420" />
    <rect x="150" y="260" width="60" height="160" />
    <polygon points="150,260 180,210 210,260" />
    <rect x="230" y="300" width="90" height="120" />
    <rect x="245" y="230" width="18" height="70" />
    <rect x="287" y="230" width="18" height="70" />
    <polygon points="238,230 322,230 280,185" />
    <rect x="340" y="280" width="50" height="140" />
    <rect x="400" y="310" width="70" height="110" />
    <polygon points="400,310 435,270 470,310" />
  </g>
  <g fill="#003a73" fill-opacity="0.75">
    <!-- central tower -->
    <rect x="700" y="120" width="120" height="300" />
    <rect x="715" y="90" width="90" height="40" />
    <polygon points="700,90 760,40 820,90" />
    <circle cx="760" cy="150" r="22" fill="#eadfc4" fill-opacity="0.9" />
    <rect x="685" y="400" width="150" height="20" />
    <rect x="620" y="260" width="70" height="160" />
    <polygon points="620,260 655,215 690,260" />
    <rect x="830" y="230" width="80" height="190" />
    <polygon points="830,230 870,180 910,230" />
    <rect x="860" y="190" width="18" height="40" />
  </g>
  <g fill="#002347" fill-opacity="0.55">
    <rect x="950" y="300" width="60" height="120" />
    <polygon points="950,300 980,255 1010,300" />
    <rect x="1020" y="270" width="90" height="150" />
    <rect x="1040" y="230" width="14" height="40" />
    <rect x="1075" y="230" width="14" height="40" />
    <polygon points="1030,230 1100,230 1065,190" />
    <rect x="1130" y="310" width="55" height="110" />
    <rect x="1200" y="280" width="70" height="140" />
    <polygon points="1200,280 1235,235 1270,280" />
    <rect x="1290" y="300" width="100" height="120" />
    <circle cx="1340" cy="260" r="26" fill="none" stroke="#002347" stroke-opacity="0.55" stroke-width="10" />
    <rect x="1410" y="330" width="50" height="90" />
    <rect x="1470" y="290" width="80" height="130" />
    <polygon points="1470,290 1510,245 1550,290" />
    <rect x="1560" y="310" width="40" height="110" />
  </g>
  <!-- tree line -->
  <g fill="#5a3b1e" fill-opacity="0.35">
    <circle cx="500" cy="370" r="36" />
    <rect x="492" y="390" width="16" height="30" />
    <circle cx="560" cy="385" r="26" />
    <rect x="552" y="398" width="12" height="22" />
    <circle cx="920" cy="380" r="30" />
    <rect x="912" y="396" width="14" height="24" />
    <circle cx="1230" cy="390" r="24" />
    <rect x="1223" y="402" width="12" height="18" />
  </g>
</svg>
